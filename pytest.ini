[pytest]
# 只收集 tests/ 下的用例。
# scripts/ 里是需要真实联网/真实 LLM 的手动冒烟脚本，不进自动化测试——
# 否则一断网整个测试套就红，掩盖真正的回归。
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 显式声明标记，避免拼错标记名被静默忽略
markers =
    network: 需要真实外网访问（默认不跑，用 -m network 显式启用）
    llm: 需要真实 LLM API key（默认不跑，会产生费用）

# 默认排除需要外部依赖的用例，保证 pytest 裸跑必须全绿
addopts = -q --strict-markers -m "not network and not llm"
